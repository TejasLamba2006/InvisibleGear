name: InvisibleGear
version: ${project.version}
main: com.github.tejaslamba2006.invisiblegear.InvisibleGear
api-version: "1.21"
authors: [TejasLamba2006]
description: Hide your armor and weapons from other players for stealth gameplay
website: https://github.com/TejasLamba2006/InvisibleGear

commands:
  invisiblegear:
    description: Main command for InvisibleGear
    usage: /<command> <toggle|status|reload>
    aliases: [ig, hidearmor, hidegear, stealth]
    permission: invisiblegear.use
  vanishgear:
    description: Toggle gear visibility
    usage: /<command>
    aliases: [vg]
    permission: invisiblegear.use

permissions:
  invisiblegear.use:
    description: Toggle your own gear visibility
    default: true
  invisiblegear.others:
    description: Toggle gear visibility for other players
    default: op
  invisiblegear.always:
    description: Keep gear hidden even after death/relog
    default: false
  invisiblegear.admin:
    description: Admin commands (reload, etc.)
    default: op
  invisiblegear.bypass:
    description: Always see other players' gear
    default: false
