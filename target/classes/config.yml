# InvisibleGear Configuration
# Hide your armor and weapons from other players!

# ===========================================
# GENERAL SETTINGS
# ===========================================

# What to hide when gear is invisible
hide:
  # Hide armor (helmet, chestplate, leggings, boots)
  armor: true
  
  # Hide held items (main hand)
  main-hand: true
  
  # Hide off-hand items (shields, totems, etc.)
  off-hand: true
  
  # Hide elytra
  elytra: true

# ===========================================
# PERSISTENCE SETTINGS
# ===========================================
persistence:
  # Save invisible gear state when player leaves
  save-on-quit: true
  
  # Restore invisible gear state when player joins
  restore-on-join: true
  
  # Keep invisible gear after death
  keep-on-death: false
  
  # Data storage method: FILE or MEMORY
  # FILE - Saves to invisiblegear_data.yml (persists across restarts)
  # MEMORY - Only keeps data while server is running
  storage: FILE

# ===========================================
# VISUAL SETTINGS
# ===========================================
visual:
  # Show particles when toggling gear visibility
  particles:
    enabled: true
    # Particle type: SMOKE, CLOUD, SPELL, ENCHANT, END_ROD
    type: CLOUD
    count: 30
    
  # Play sound when toggling
  sounds:
    enabled: true
    # Sound when hiding gear
    hide-sound: ENTITY_ENDERMAN_TELEPORT
    hide-volume: 0.5
    hide-pitch: 1.5
    # Sound when showing gear
    show-sound: ITEM_ARMOR_EQUIP_LEATHER
    show-volume: 0.5
    show-pitch: 1.0

# ===========================================
# UPDATE SETTINGS
# ===========================================
update:
  # How often to refresh hidden gear (in ticks, 20 = 1 second)
  # Lower = more responsive but more server load
  # Set to 0 to only update on equipment change events
  refresh-interval: 10
  
  # Maximum distance at which gear hiding is applied
  # Players further than this will see your gear (performance optimization)
  # Set to 0 for unlimited
  max-distance: 0

# ===========================================
# WORLD SETTINGS
# ===========================================
worlds:
  # Enable/disable per world
  # If a world is not listed, it uses 'default' value
  default: true
  
  # Specific world overrides (uncomment to use)
  # world: true
  # world_nether: true
  # world_the_end: true

# ===========================================
# MESSAGES
# ===========================================
messages:
  prefix: "&8[&bInvisibleGear&8] &7"
  gear-hidden: "&aYour gear is now &lHIDDEN&a from other players!"
  gear-shown: "&eYour gear is now &lVISIBLE&e to other players."
  already-hidden: "&cYour gear is already hidden!"
  already-shown: "&cYour gear is already visible!"
  status-hidden: "&7Status: &aGear is hidden"
  status-shown: "&7Status: &eGear is visible"
  player-not-found: "&cPlayer not found!"
  no-permission: "&cYou don't have permission to do that!"
  reload: "&aConfiguration reloaded!"
  world-disabled: "&cInvisible gear is disabled in this world."
  cooldown: "&cPlease wait {time} seconds before toggling again."
  
  # Messages for toggling other players
  target-gear-hidden: "&a{player}'s gear is now hidden."
  target-gear-shown: "&e{player}'s gear is now visible."
  your-gear-hidden-by: "&aYour gear was hidden by {player}."
  your-gear-shown-by: "&eYour gear was made visible by {player}."

# ===========================================
# COOLDOWN
# ===========================================
cooldown:
  # Enable toggle cooldown
  enabled: false
  
  # Cooldown in seconds
  duration: 5
  
  # Bypass permission: invisiblegear.cooldown.bypass

# ===========================================
# ADVERTISEMENT
# ===========================================
# Show advertisement for SMP Core plugin on enable (if not installed)
show-advertisement: true
